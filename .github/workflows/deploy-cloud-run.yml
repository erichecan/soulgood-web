name: Deploy to Cloud Run

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: soulgood-506103
      REGION: northamerica-northeast2
      SERVICE_NAME: soulgood-web
      REPOSITORY: soulgood-web
      IMAGE: northamerica-northeast2-docker.pkg.dev/soulgood-506103/soulgood-web/app:${{ github.sha }}
      CLOUDSQL_CONNECTION: soulgood-506103:northamerica-northeast2:soulgood-db

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/332004446228/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deploy@soulgood-506103.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build
        run: docker build -t ${{ env.IMAGE }} .

      - run: docker push ${{ env.IMAGE }}

      - name: Deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --service-account=github-actions-deploy@soulgood-506103.iam.gserviceaccount.com \
            --add-cloudsql-instances=${{ env.CLOUDSQL_CONNECTION }} \
            --min-instances=0 --max-instances=3 \
            --memory=512Mi --cpu=1 \
            --set-secrets="DATABASE_URL=database-url:latest,AUTH_SECRET=auth-secret:latest,AUTH_GOOGLE_ID=auth-google-id:latest,AUTH_GOOGLE_SECRET=auth-google-secret:latest" \
            --quiet

      - name: Verify
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "Deployed: $URL"
          echo "SERVICE_URL=$URL" >> "$GITHUB_ENV"
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" "$URL"
